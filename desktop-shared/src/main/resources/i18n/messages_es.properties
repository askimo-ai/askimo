# OpenAI-Compatible template taglines and setup help (see OpenAiCompatibleTemplate.kt)
provider.template.cloudflare_ai.tagline=Ejecuta modelos de IA en la red perimetral global de Cloudflare con Workers AI.
provider.template.cloudflare_ai.help=💡 Para usar Cloudflare AI:\n\n1. Busca tu ID de cuenta en tu panel de Cloudflare\n2. Reemplaza {ACCOUNT_ID} en la URL base con él\n3. Crea un token de API con permiso 'Workers AI' en:\n   dash.cloudflare.com/profile/api-tokens
provider.template.deepseek.tagline=Modelos de razonamiento y de propósito general con una API directa y compatible con OpenAI.
provider.template.deepseek.help=💡 Para usar DeepSeek:\n\n1. Crea una clave de API en: platform.deepseek.com/api_keys\n2. Añade saldo a tu cuenta de DeepSeek si es necesario\n3. Haz clic en Siguiente para explorar los modelos disponibles
provider.template.groq.tagline=Inferencia ultrarrápida para modelos de código abierto — Llama, Mixtral, Gemma y más.
provider.template.groq.help=💡 Para usar Groq:\n\n1. Consigue tu clave API gratuita en: console.groq.com/keys\n2. Ingresa un nombre de modelo, p. ej. llama-3.1-8b-instant\n3. Haz clic en Siguiente para explorar todos los modelos disponibles
provider.template.nvidia_nim.tagline=Ejecuta modelos de IA optimizados en la infraestructura de GPU en la nube de NVIDIA.
provider.template.nvidia_nim.help=💡 Para usar NVIDIA NIM:\n\n1. Consigue tu clave API en: build.nvidia.com\n2. Ingresa un nombre de modelo, p. ej. meta/llama-3.1-8b-instruct\n3. Haz clic en Siguiente para explorar todos los modelos disponibles
provider.template.openrouter.tagline=Accede a más de 300 modelos — GPT, Claude, Llama, Gemini, Mistral y más a través de una sola API.
provider.template.openrouter.help=💡 Para usar OpenRouter:\n\n1. Consigue tu clave API gratuita en: openrouter.ai/keys\n2. Haz clic en Siguiente para explorar más de 300 modelos disponibles\n3. Muchos modelos tienen un nivel gratuito — no se requiere tarjeta de crédito
provider.template.together_ai.tagline=Inferencia rápida y económica para más de 100 modelos de código abierto.
provider.template.together_ai.help=💡 Para usar Together AI:\n\n1. Consigue tu clave API en: api.together.ai/settings/api-keys\n2. Haz clic en Siguiente para explorar los modelos disponibles,\n   p. ej. meta-llama/Llama-3-8b-chat-hf
provider.template.lite_llm.tagline=A unified proxy that lets you call 100+ LLMs using the OpenAI format.
provider.search.placeholder=Search providers...
provider.search.no_results=No providers found
provider.template.lite_llm.help=💡 To use LiteLLM:\n\n1. Start the LiteLLM proxy: litellm --model ollama/llama3\n2. The default URL is http://localhost:4000/v1\n3. No API key is needed for local setups (set any value if prompted)
provider.template.lmstudio.tagline=Ejecuta LLM locales con una interfaz de escritorio fácil de usar. No se necesita clave de API. Descarga LM Studio desde lmstudio.ai y activa el servidor local.
provider.template.lmstudio.help=💡 Para usar LM Studio:\n\n1. Instala LM Studio desde: https://lmstudio.ai/\n2. Carga un modelo e inicia el servidor local (pestaña Desarrollador)\n3. Opcionalmente, cambia la URL base si no usas el puerto predeterminado 1234
provider.template.docker_ai.tagline=Ejecuta modelos de IA a través del ejecutor de modelos integrado de Docker Desktop. No se necesita clave de API. Requiere Docker Desktop 4.40+ con la función de ejecución de modelos habilitada.
provider.template.docker_ai.help=💡 Para usar Docker AI:\n\n1. Asegúrate de que Docker Desktop 4.40+ esté instalado y en ejecución\n2. Habilita la función Model Runner en la configuración de Docker Desktop\n3. Descarga un modelo, por ejemplo: docker model pull ai/qwen3-embedding:0.6B-F16\n4. La URL base predeterminada es http://localhost:12434/v1
provider.template.localai.tagline=Servidor de IA local autohospedado y compatible con OpenAI. No se necesita clave de API. Instala LocalAI, carga un modelo e inicia el servidor antes de conectarte.
provider.template.localai.help=💡 Para usar LocalAI:\n\n1. Instala LocalAI desde: https://localai.io/\n2. Descarga un modelo e inicia el servidor\n3. La URL base predeterminada es http://localhost:8080/v1
provider.template.ollama.tagline=Ejecuta modelos de código abierto localmente. No se necesita clave de API. Descarga Ollama desde ollama.com y luego descarga un modelo (p. ej., ollama pull llama3) antes de conectarte.
provider.template.ollama.help=💡 Para usar Ollama:\n\n1. Instala Ollama desde: https://ollama.com/\n2. Descarga un modelo: ollama pull llama3\n3. La URL base predeterminada es http://localhost:11434/v1


