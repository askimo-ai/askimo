# Onboarding Step 1: Welcome
onboarding.step.welcome.title=👋 ¡Bienvenido a Askimo!
onboarding.step.welcome.description=Tu asistente personal de IA. Chatea con varios modelos de IA, organiza el conocimiento en proyectos y automatiza flujos de trabajo con skills y planes.
onboarding.step.welcome.feature1.title=💬 Chatea con IA
onboarding.step.welcome.feature1.description=Haz preguntas, recibe ayuda con tareas o conversa con cualquier modelo de IA.
onboarding.step.welcome.feature2.title=📁 Organiza con proyectos
onboarding.step.welcome.feature2.description=Agrupa chats y adjunta fuentes de conocimiento para que la IA siempre tenga el contexto correcto.
onboarding.step.welcome.feature3.title=⚡ Automatiza con Skills y Planes
onboarding.step.welcome.feature3.description=Crea flujos de trabajo de IA reutilizables y planes de varios pasos que se ejecutan automáticamente.

# Onboarding Step 2: Profile
onboarding.step.profile.title=Cuéntanos sobre ti
onboarding.step.profile.description=Tu perfil ayuda a Askimo a personalizar las respuestas de IA según tu experiencia y necesidades. Puedes actualizarlo en cualquier momento en Configuración.
