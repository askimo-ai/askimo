# Error Messages
error.network=⚠️ No se puede conectar al servicio de IA{endpoint}\n\nPor favor, compruebe:\n• Su conexión a Internet\n• La URL del servicio de IA (revise la configuración)\n• La configuración del firewall\n• La disponibilidad del servicio
error.authentication=⚠️ La clave API no es válida o falta{provider}\n\nSolucione esto configurando su clave API en Ajustes.
error.model_not_found=⚠️ Modelo no encontrado: {model}\n\nEste modelo puede haber sido desactivado o eliminado por el proveedor. Por favor, seleccione un modelo diferente.
error.provider_not_configured=⚠️ No hay ningún proveedor de IA configurado.\n\nPara comenzar a chatear:\n1. Abre los Ajustes\n2. Selecciona un proveedor de IA (OpenAI, Ollama, Anthropic, etc.)\n3. Introduce tu API key o configura la conexión
error.rate_limit=⚠️ Límite de uso excedido\n{retryAfter}\n\nHa alcanzado su límite de uso de la API. Espere antes de enviar más mensajes.
error.insufficient_credits=⚠️ Créditos insuficientes\n\nSu saldo de créditos es demasiado bajo.\n\nVaya a la página de facturación para añadir créditos.
error.timeout=⚠️ La solicitud expiró después de {timeout} segundos\n\nPosibles causas:\n• Alta carga del servidor – intente nuevamente más tarde\n• Consulta compleja – intente simplificarla\n• Latencia de red
error.context_length=⚠️ Ventana de contexto excedida\n\nLa entrada total (historial de la conversación + su mensaje + archivos adjuntos) es demasiado grande para que este modelo la procese.\n\nPara solucionar esto:\n• Inicie una nueva sesión de chat para borrar el historial de la conversación\n• Acorte su mensaje o elimine archivos adjuntos grandes\n• Si utiliza un modelo local (Ollama / LM Studio / Docker), aumente el tamaño del contexto en su configuración\n• Cambie a un modelo con una ventana de contexto más grande
error.invalid_request=⚠️ Solicitud no válida: {details}\n\nRevise su entrada e inténtelo de nuevo.
error.local_server=⚠️ ¡Error del servidor de IA local!\n\nEl proceso del servidor de IA se bloqueó o no pudo cargar el modelo. Esto no es causado por Askimo.\n\nPosibles causas:\n• El archivo del modelo está corrupto o incompleto — intente descargarlo nuevamente\n• RAM/VRAM insuficiente — pruebe una cuantización menor (p. ej. Q4 en lugar de Q8)\n• Formato de modelo no compatible con la versión actual del servidor\n• El proceso del servidor fue terminado por el sistema operativo (sin memoria)\n\nQué hacer:\n1. Revise los registros de su servidor de IA local\n2. Reinicie el servidor e inténtelo de nuevo\n3. Vuelva a descargar el modelo\n4. Pruebe un modelo diferente o un nivel de cuantización distinto\n\nDetalles técnicos: {details}
error.empty_http_response=⚠️ ¡El servidor cerró la conexión sin responder!\n\nModelo: {0}\n\nEsto suele ocurrir cuando un proveedor de IA local descarta la solicitud silenciosamente en lugar de devolver un error. La ventana de contexto del modelo es demasiado pequeña para la solicitud actual.\n\nCausas comunes:\n• El historial de la conversación se ha vuelto demasiado largo tras varios turnos\n• Las herramientas habilitadas añaden datos extra a cada solicitud; incluso una pregunta corta con varias herramientas activas puede superar el límite\n• Archivos adjuntos grandes o fragmentos de código han hecho que la solicitud supere el límite\n\n{1}\n\nOtras cosas que intentar:\n• Inicie una nueva conversación para restablecer el contexto\n• Deshabilite las herramientas que no sean necesarias para esta tarea\n• Reduzca el tamaño de su mensaje o de los archivos adjuntos
error.empty_http_response.hint.generic=Para aumentar la ventana de contexto:\n• Compruebe los ajustes de su proveedor para ver si hay una opción de longitud de contexto / tamaño de contexto y auméntela (ej. a 32768 tokens)\n• Reinicie el proveedor después de cambiar la configuración
error.remote_server=⚠️ Error del servidor del proveedor de IA\n\nEl servidor del proveedor devolvió un error temporal (p. ej. sobrecargado o no disponible). Esto no es causado por Askimo.\n\nQué hacer:\n• Espere un momento y vuelva a intentarlo — suele ser temporal\n• Consulte la página de estado del proveedor si el problema persiste\n\nDetalles técnicos: {details}
error.malformed_tool_call=⚠️ ¡El modelo de IA intentó una llamada a herramienta no válida!\n\nEl modelo transmitió una solicitud de herramienta incompleta o mal formada (falta el nombre/argumentos). Esto no es causado por Askimo — es un problema en la salida de llamadas a funciones del modelo de IA o del backend, más común en modelos más pequeños o locales.\n\nQué hacer:\n1. Intente enviar el mensaje de nuevo — normalmente es algo temporal\n2. Si sigue ocurriendo, intente deshabilitar algunas herramientas habilitadas para reducir la ambigüedad\n3. Considere probar un modelo diferente más adecuado para llamadas a herramientas/funciones
error.system=⚠️ Error del sistema\n\nOcurrió un error inesperado: {errorCode}\n\nContacte al soporte de Askimo con:\n• Lo que estaba haciendo\n• El código de error anterior\n• La marca de tiempo

