# Error Messages
error.network=⚠️ 无法连接到 AI 服务{endpoint}\n\n请检查：\n• 网络连接\n• AI 服务地址（检查设置）\n• 防火墙设置\n• 服务是否可用
error.authentication=⚠️ API 密钥无效或缺失{provider}\n\n请在设置中配置您的 API 密钥以解决此问题。
error.model_not_found=⚠️ 未找到模型：{model}\n\n该模型可能已被提供商弃用或删除。请选择其他模型。
error.provider_not_configured=⚠️ 尚未配置 AI 提供商。\n\n开始聊天需要：\n1. 打开设置\n2. 选择 AI 提供商（OpenAI、Ollama、Anthropic 等）\n3. 输入 API Key 或配置连接
error.rate_limit=⚠️ 已超过速率限制\n{retryAfter}\n\n您已达到 API 使用上限，请稍后再发送消息。
error.insufficient_credits=⚠️ 积分不足\n\n您的积分余额过低。\n\n请前往提供商的账单页面充值。
error.timeout=⚠️ 请求在 {timeout} 秒后超时\n\n可能原因：\n• 服务器负载过高，请稍后重试\n• 请求过于复杂，请尝试简化\n• 网络延迟
error.context_length=⚠️ 上下文窗口已超出限制\n\n总输入内容（对话历史记录 + 您的消息 + 附件）太大，此模型无法处理。\n\n解决方法：\n• 开始新的聊天会话以清除对话历史记录\n• 缩短您的消息或删除较大的附件\n• 如果使用本地模型（Ollama / LM Studio / Docker），请在设置中增加上下文大小\n• 切换到具有更大上下文窗口的模型
error.invalid_request=⚠️ 无效请求：{details}\n\n请检查输入内容后重试。
error.local_server=⚠️ 本地 AI 服务器错误！\n\nAI 服务器进程崩溃或无法加载模型。这不是由 Askimo 引起的。\n\n可能原因：\n• 模型文件损坏或不完整 — 请尝试重新下载\n• RAM/VRAM 不足 — 请尝试更小的量化版本（例如 Q4 而非 Q8）\n• 当前服务器版本不支持该模型格式\n• 服务器进程被操作系统终止（内存不足）\n\n处理方法：\n1. 查看本地 AI 服务器日志\n2. 重启服务器后重试\n3. 重新下载模型\n4. 尝试其他模型或量化级别\n\n技术详情：{details}
error.empty_http_response=⚠️ 服务器在未响应的情况下关闭了连接！\n\n模型：{0}\n\n这通常是因为本地 AI 提供程序静默丢弃了请求，而不是返回错误。当前请求超过了模型的上下文窗口限制。\n\n常见原因：\n• 会话历史记录在多轮对话中变得过长\n• 已启用的工具在每次请求中都添加了额外数据——即使是简单的问题，如果激活了多个工具也可能超出限制\n• 大型的附件文件或代码片段导致请求超限\n\n{1}\n\n其他建议尝试的操作：\n• 开始新的会话以重置上下文\n• 禁用当前任务不需要的工具\n• 减小消息或附件的大小
error.empty_http_response.hint.generic=要增加上下文窗口：\n• 检查提供程序的设置，查找上下文长度/大小选项并将其调高 (例如设置为 32768 token)\n• 更改设置后重启提供程序
error.remote_server=⚠️ AI 提供商服务器错误\n\n提供商服务器返回了临时错误（例如过载或不可用）。这不是由 Askimo 引起的。\n\n处理方法：\n• 稍等片刻后重试 — 通常只是短暂问题\n• 若问题持续，请查看提供商的状态页面\n\n技术详情：{details}
error.system=⚠️ 系统错误\n\n发生了意外错误：{errorCode}\n\n请联系 Askimo 支持，并提供：\n• 您的操作步骤\n• 上述错误代码\n• 发生时间

