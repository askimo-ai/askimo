# OpenAI-Compatible template taglines and setup help (see OpenAiCompatibleTemplate.kt)
provider.template.cloudflare_ai.tagline=使用 Workers AI 在 Cloudflare 的全球边缘网络上运行 AI 模型。
provider.template.cloudflare_ai.help=💡 使用 Cloudflare AI：\n\n1. 在 Cloudflare 控制台中找到您的 Account ID\n2. 用它替换基础 URL 中的 {ACCOUNT_ID}\n3. 在以下位置创建具有 'Workers AI' 权限的 API 令牌：\n   dash.cloudflare.com/profile/api-tokens
provider.template.deepseek.tagline=具备直观的 OpenAI 兼容 API 的推理和通用模型。
provider.template.deepseek.help=💡 要使用 DeepSeek：\n\n1. 在此处创建 API 密钥：platform.deepseek.com/api_keys\n2. 如有必要，请为您的 DeepSeek 账户充值\n3. 点击“下一步”浏览可用模型
provider.template.groq.tagline=为开源模型提供超快推理 — Llama、Mixtral、Gemma 等。
provider.template.groq.help=💡 使用 Groq：\n\n1. 在 console.groq.com/keys 获取免费 API 密钥\n2. 输入模型名称，例如 llama-3.1-8b-instant\n3. 点击"下一步"浏览所有可用模型
provider.template.nvidia_nim.tagline=在 NVIDIA 的云 GPU 基础设施上运行优化的 AI 模型。
provider.template.nvidia_nim.help=💡 使用 NVIDIA NIM：\n\n1. 在 build.nvidia.com 获取 API 密钥\n2. 输入模型名称，例如 meta/llama-3.1-8b-instruct\n3. 点击"下一步"浏览所有可用模型
provider.template.openrouter.tagline=通过一个 API 访问 300 多个模型 — GPT、Claude、Llama、Gemini、Mistral 等。
provider.template.openrouter.help=💡 使用 OpenRouter：\n\n1. 在 openrouter.ai/keys 获取免费 API 密钥\n2. 点击"下一步"浏览 300 多个可用模型\n3. 许多模型提供免费额度 — 无需信用卡
provider.template.together_ai.tagline=为 100 多个开源模型提供快速、经济的推理。
provider.template.together_ai.help=💡 使用 Together AI：\n\n1. 在 api.together.ai/settings/api-keys 获取 API 密钥\n2. 点击"下一步"浏览可用模型，\n   例如 meta-llama/Llama-3-8b-chat-hf
provider.template.lite_llm.tagline=A unified proxy that lets you call 100+ LLMs using the OpenAI format.
provider.search.placeholder=Search providers...
provider.search.no_results=No providers found
provider.template.lite_llm.help=💡 To use LiteLLM:\n\n1. Start the LiteLLM proxy: litellm --model ollama/llama3\n2. The default URL is http://localhost:4000/v1\n3. No API key is needed for local setups (set any value if prompted)
provider.template.lmstudio.tagline=使用易于使用的桌面界面运行本地大语言模型。无需 API 密钥。从 lmstudio.ai 下载 LM Studio 并启用本地服务器。
provider.template.lmstudio.help=💡 如何使用 LM Studio：\n\n1. 从 https://lmstudio.ai/ 安装 LM Studio\n2. 加载模型并启动本地服务器（“开发者”选项卡）\n3. 如果未使用默认端口 1234，可按需更改基础 URL
provider.template.docker_ai.tagline=通过 Docker Desktop 内置的模型运行器运行 AI 模型。无需 API 密钥。需要启用“Model Runner”功能的 Docker Desktop 4.40 及以上版本。
provider.template.docker_ai.help=💡 如何使用 Docker AI：\n\n1. 确保已安装并运行 Docker Desktop 4.40+\n2. 在 Docker Desktop 设置中启用 Model Runner 功能\n3. 拉取模型，例如：docker model pull ai/qwen3-embedding:0.6B-F16\n4. 默认基础 URL 为 http://localhost:12434/v1
provider.template.localai.tagline=自托管、兼容 OpenAI 的本地 AI 服务器。无需 API 密钥。在连接前安装 LocalAI、加载模型并启动服务器。
provider.template.localai.help=💡 如何使用 LocalAI：\n\n1. 从 https://localai.io/ 安装 LocalAI\n2. 拉取模型并启动服务器\n3. 默认基础 URL 为 http://localhost:8080/v1
provider.template.ollama.tagline=在本地运行开源模型。无需 API 密钥。从 ollama.com 下载 Ollama，然后在连接前拉取模型（例如 ollama pull llama3）。
provider.template.ollama.help=💡 如何使用 Ollama：\n\n1. 从 https://ollama.com/ 安装 Ollama\n2. 拉取模型：ollama pull llama3\n3. 默认基础 URL 为 http://localhost:11434/v1


