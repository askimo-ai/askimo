# Error Messages
error.network=⚠️ Impossible de se connecter au service IA{endpoint}\n\nVeuillez vérifier \:\n• Votre connexion Internet\n• L’URL du service IA (vérifiez les paramètres)\n• Les paramètres du pare-feu\n• La disponibilité du service
error.authentication=⚠️ La clé API est manquante ou invalide{provider}\n\nCorrigez cela en configurant votre clé API dans les paramètres.
error.model_not_found=⚠️ Modèle introuvable \: {model}\n\nCe modèle a peut-être été déprécié ou supprimé par le fournisseur. Veuillez sélectionner un autre modèle.
error.provider_not_configured=⚠️ Aucun fournisseur IA configuré.\n\nPour commencer à discuter \:\n1. Ouvrez les paramètres\n2. Sélectionnez un fournisseur IA (OpenAI, Ollama, Anthropic, etc.)\n3. Entrez votre clé API ou configurez la connexion
error.rate_limit=⚠️ Limite d’utilisation atteinte\n{retryAfter}\n\nVous avez atteint votre limite d’utilisation de l’API. Veuillez patienter avant d’envoyer d’autres messages.
error.insufficient_credits=⚠️ Crédits insuffisants\n\nVotre solde est trop faible pour utiliser ce fournisseur.\n\nVisitez la page de facturation pour ajouter des crédits.
error.timeout=⚠️ La requête a expiré après {timeout} secondes\n\nCauses possibles \:\n• Charge serveur élevée – réessayez plus tard\n• Requête complexe – simplifiez-la\n• Latence réseau
error.context_length=⚠️ Fenêtre de contexte dépassée\n\nL'entrée totale (historique de la conversation + votre message + pièces jointes) est trop volumineuse pour être traitée par ce modèle.\n\nPour corriger cela \:\n• Démarrez une nouvelle session de chat pour effacer l'historique de la conversation\n• Raccourcissez votre message ou supprimez les pièces jointes volumineuses\n• Si vous utilisez un modèle local (Ollama / LM Studio / Docker), augmentez la taille du contexte dans ses paramètres\n• Passez à un modèle avec une fenêtre de contexte plus grande
error.invalid_request=⚠️ Requête invalide \: {details}\n\nVeuillez vérifier votre saisie et réessayer.
error.local_server=⚠️ Erreur du serveur IA local \!\n\nLe processus du serveur IA a planté ou n''a pas pu charger le modèle. Ce n''est pas causé par Askimo.\n\nCauses possibles \:\n• Le fichier modèle est corrompu ou incomplet — essayez de le retélécharger\n• RAM/VRAM insuffisante — essayez une quantification plus petite (ex. Q4 au lieu de Q8)\n• Format de modèle non pris en charge par la version actuelle du serveur\n• Le processus serveur a été tué par le système d''exploitation (mémoire insuffisante)\n\nQue faire \:\n1. Consultez les journaux de votre serveur IA local\n2. Redémarrez le serveur et réessayez\n3. Re-téléchargez le modèle\n4. Essayez un autre modèle ou niveau de quantification\n\nDétails techniques \: {details}
error.empty_http_response=⚠️ Le serveur a fermé la connexion sans répondre \!\n\nModèle \: {0}\n\nCela se produit généralement lorsqu''un fournisseur d''IA local ignore silencieusement la requête au lieu de renvoyer une erreur. La fenêtre de contexte du modèle est trop petite pour la requête actuelle.\n\nCauses courantes \:\n• L''historique de la conversation est devenu trop long au fil des tours\n• Les outils activés ajoutent des données supplémentaires à chaque requête — même une question courte avec plusieurs outils actifs peut dépasser la limite\n• Des fichiers joints volumineux ou des extraits de code ont fait dépasser la limite à la requête\n\n{1}\n\nAutres pistes à explorer \:\n• Démarrez une nouvelle conversation pour réinitialiser le contexte\n• Désactivez les outils qui ne sont pas nécessaires pour cette tâche\n• Réduisez la taille de votre message ou des fichiers joints
error.empty_http_response.hint.generic=Pour augmenter la fenêtre de contexte \:\n• Vérifiez les paramètres de votre fournisseur pour une option de longueur de contexte / taille de contexte et augmentez-la (ex. à 32768 jetons)\n• Redémarrez le fournisseur après avoir modifié le paramètre
error.remote_server=⚠️ Erreur du serveur du fournisseur IA\n\nLe serveur du fournisseur a retourné une erreur temporaire (ex. surchargé ou indisponible). Ce n''est pas causé par Askimo.\n\nQue faire \:\n• Attendez un moment et réessayez — c''est généralement passager\n• Consultez la page de statut du fournisseur si le problème persiste\n\nDétails techniques \: {details}
