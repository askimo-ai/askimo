# OpenAI-Compatible template taglines and setup help (see OpenAiCompatibleTemplate.kt)
provider.template.cloudflare_ai.tagline=Exécutez des modèles d'IA sur le réseau périphérique mondial de Cloudflare avec Workers AI.
provider.template.cloudflare_ai.help=💡 Pour utiliser Cloudflare AI \:\n\n1. Trouvez votre ID de compte dans votre tableau de bord Cloudflare\n2. Remplacez {ACCOUNT_ID} dans l''URL de base par celui-ci\n3. Créez un jeton API avec l''autorisation « Workers AI » sur \:\n   dash.cloudflare.com/profile/api-tokens
provider.template.deepseek.tagline=Modèles de raisonnement et polyvalents dotés d'une API simple compatible avec OpenAI.
provider.template.deepseek.help=💡 Pour utiliser DeepSeek \:\n\n1. Créez une clé API sur \: platform.deepseek.com/api_keys\n2. Ajoutez du crédit à votre compte DeepSeek si nécessaire\n3. Cliquez sur Suivant pour parcourir les modèles disponibles
provider.template.groq.tagline=Inférence ultra-rapide pour les modèles open source — Llama, Mixtral, Gemma et plus encore.
provider.template.groq.help=💡 Pour utiliser Groq \:\n\n1. Obtenez votre clé API gratuite sur \: console.groq.com/keys\n2. Saisissez un nom de modèle, par ex. llama-3.1-8b-instant\n3. Cliquez sur Suivant pour parcourir tous les modèles disponibles
provider.template.nvidia_nim.tagline=Exécutez des modèles d'IA optimisés sur l'infrastructure GPU cloud de NVIDIA.
provider.template.nvidia_nim.help=💡 Pour utiliser NVIDIA NIM \:\n\n1. Obtenez votre clé API sur \: build.nvidia.com\n2. Saisissez un nom de modèle, par ex. meta/llama-3.1-8b-instruct\n3. Cliquez sur Suivant pour parcourir tous les modèles disponibles
provider.template.openrouter.tagline=Accédez à plus de 300 modèles — GPT, Claude, Llama, Gemini, Mistral et plus, via une seule API.
provider.template.openrouter.help=💡 Pour utiliser OpenRouter \:\n\n1. Obtenez votre clé API gratuite sur \: openrouter.ai/keys\n2. Cliquez sur Suivant pour parcourir plus de 300 modèles disponibles\n3. De nombreux modèles offrent un niveau gratuit — aucune carte de crédit requise
provider.template.together_ai.tagline=Inférence rapide et abordable pour plus de 100 modèles open source.
provider.template.together_ai.help=💡 Pour utiliser Together AI \:\n\n1. Obtenez votre clé API sur \: api.together.ai/settings/api-keys\n2. Cliquez sur Suivant pour parcourir les modèles disponibles,\n   par ex. meta-llama/Llama-3-8b-chat-hf
provider.template.lite_llm.tagline=A unified proxy that lets you call 100+ LLMs using the OpenAI format.
provider.search.placeholder=Search providers...
provider.search.no_results=No providers found
provider.template.lite_llm.help=💡 To use LiteLLM\:\n\n1. Start the LiteLLM proxy\: litellm --model ollama/llama3\n2. The default URL is http\://localhost\:4000/v1\n3. No API key is needed for local setups (set any value if prompted)
provider.template.lmstudio.tagline=Exécutez des LLM locaux avec une interface de bureau simple d'utilisation. Aucune clé API requise. Téléchargez LM Studio sur lmstudio.ai et activez le serveur local.
provider.template.lmstudio.help=💡 Pour utiliser LM Studio \:\n\n1. Installez LM Studio depuis \: https\://lmstudio.ai/\n2. Chargez un modèle et démarrez le serveur local (onglet Développeur)\n3. Modifiez éventuellement l'URL de base si vous n'utilisez pas le port par défaut 1234
provider.template.docker_ai.tagline=Exécutez des modèles d'IA via l'exécuteur de modèles intégré de Docker Desktop. Aucune clé API requise. Nécessite Docker Desktop 4.40+ avec la fonctionnalité Model Runner activée.
provider.template.docker_ai.help=💡 Pour utiliser Docker AI \:\n\n1. Assurez-vous que Docker Desktop 4.40+ est installé et en cours d'exécution\n2. Activez la fonctionnalité Model Runner dans les paramètres de Docker Desktop\n3. Téléchargez un modèle, ex. \: docker model pull ai/qwen3-embedding\:0.6B-F16\n4. L'URL de base par défaut est http\://localhost\:12434/v1
provider.template.localai.tagline=Serveur IA local auto-hébergé et compatible OpenAI. Aucune clé API requise. Installez LocalAI, chargez un modèle et démarrez le serveur avant de vous connecter.
provider.template.localai.help=💡 Pour utiliser LocalAI \:\n\n1. Installez LocalAI depuis \: https\://localai.io/\n2. Téléchargez un modèle et démarrez le serveur\n3. L'URL de base par défaut est http\://localhost\:8080/v1
provider.template.ollama.tagline=Exécutez des modèles open source localement. Aucune clé API requise. Téléchargez Ollama sur ollama.com, puis téléchargez un modèle (ex. \: ollama pull llama3) avant de vous connecter.
provider.template.ollama.help=💡 Pour utiliser Ollama \:\n\n1. Installez Ollama depuis \: https\://ollama.com/\n2. Téléchargez un modèle \: ollama pull llama3\n3. L'URL de base par défaut est http\://localhost\:11434/v1


