name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      # Explicit, ephemeral-runner-scoped opt-in for Testcontainers' container reuse (see
      # cli/src/test/kotlin/io/askimo/testcontainers/TestContainersConfig.kt for why this isn't
      # done from test code). Safe here: the runner's home is discarded after the job. Linux
      # only — macOS runners have no Docker, so Docker-based tests are disabled there entirely.
      - name: Enable Testcontainers reuse
        if: runner.os == 'Linux'
        run: echo "testcontainers.reuse.enable=true" >> ~/.testcontainers.properties

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" test

      # GitHub-hosted macOS runners don't support Docker (no nested virtualization), so
      # Testcontainers-based tests are skipped here, same as on Windows below.
      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        env:
          DISABLE_DOCKER_TESTS: 'true'
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" -PDISABLE_DOCKER_TESTS=true test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DISABLE_DOCKER_TESTS: 'true'
        run: .\gradlew.bat --no-daemon "-Dorg.gradle.jvmargs=-Xmx2g" -PDISABLE_DOCKER_TESTS=true test

      # Lincheck concurrency tests (see desktop-shared/.../OrderedEventQueueLincheckTest.kt):
      # kept as a separate task/step from `test` because it needs extra JVM args Lincheck
      # requires (see desktop-shared/build.gradle.kts) and can be slower. Runs on all three
      # OSes like regular tests, since concurrency/scheduling behavior is platform-sensitive.
      - name: Run Lincheck concurrency tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" lincheckTest

      - name: Run Lincheck concurrency tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon "-Dorg.gradle.jvmargs=-Xmx2g" lincheckTest

      - name: Upload Lincheck test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lincheck-test-reports-${{ matrix.name }}-attempt${{ github.run_attempt }}
          path: "**/build/reports/tests/lincheckTest"
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ matrix.name }}-attempt${{ github.run_attempt }}
          path: "**/build/reports/tests/test"
          retention-days: 7

      # Report-only: reuses the tests that just ran (no re-execution) to produce the merged
      # Kover coverage dashboard. Uses --continue and continue-on-error so a flaky/failing test
      # elsewhere never blocks this job — pass/fail for the job is still decided by the `test`
      # step above. See the module Kover config in build.gradle.kts for how the numbers are
      # computed.
      - name: Generate coverage report (Linux)
        if: always() && runner.os == 'Linux'
        continue-on-error: true
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" --continue coverageReport

      - name: Generate coverage report (macOS)
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        env:
          DISABLE_DOCKER_TESTS: 'true'
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" -PDISABLE_DOCKER_TESTS=true --continue coverageReport

      - name: Generate coverage report (Windows)
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          DISABLE_DOCKER_TESTS: 'true'
        run: .\gradlew.bat --no-daemon "-Dorg.gradle.jvmargs=-Xmx2g" -PDISABLE_DOCKER_TESTS=true --continue coverageReport

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports-${{ matrix.name }}-attempt${{ github.run_attempt }}
          path: "build/reports/kover/**"
          retention-days: 7

