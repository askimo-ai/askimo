name: Release

on:
  push:
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  # ── Build (PRs + releases) ────────────────────────────────────────────────
  desktop-build:
    name: desktop-build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-intel
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
          - os: ubuntu-22.04-arm
            name: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Build desktop application (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" desktop:build

      - name: Build desktop application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon "-Dorg.gradle.jvmargs=-Xmx4g" desktop:build


  # ── Package + notarize installers (release tags only) ────────────────────
  desktop-package:
    name: desktop-package-${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            task: customNotarizeMacApp
            artifact-pattern: "desktop/build/compose/notarized/Askimo-signed.dmg"
            artifact-suffix: "macos-arm64"
          - os: macos-15-intel
            name: macos-intel
            task: customNotarizeMacApp
            artifact-pattern: "desktop/build/compose/notarized/Askimo-signed.dmg"
            artifact-suffix: "macos-intel"
          - os: ubuntu-22.04
            name: linux
            task: packageDeb
            artifact-pattern: "desktop/build/compose/binaries/main/deb/*.deb"
            artifact-suffix: "linux"
          - os: windows-latest
            name: windows
            task: packageMsi
            artifact-pattern: "desktop/build/compose/binaries/main/msi/*.msi"
            artifact-suffix: "windows"
            arch: "x64"
          - os: ubuntu-22.04-arm
            name: linux-arm
            task: packageDeb
            artifact-pattern: "desktop/build/compose/binaries/main/deb/*.deb"
            artifact-suffix: "linux-arm64"
            arch: "arm64"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      # Runs build + sign + notarize + staple in one Gradle task chain.
      # On macOS the chain is: build → signMacApp → notarizeApp → createSignedDmg → customNotarizeDmg → customNotarizeMacApp
      - name: Package and notarize installer (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" desktop:${{ matrix.task }}

      - name: Package installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon "-Dorg.gradle.jvmargs=-Xmx4g" desktop:${{ matrix.task }}

      - name: Sign Windows MSI (Azure Trusted Signing)
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: desktop/build/compose/binaries/main/msi
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ── CHECKPOINT 1: verify DMG is properly signed + stapled before upload ──
      # If this fails the whole pipeline stops — no point uploading a broken artifact.
      # ── Shared helper: retry `xcrun stapler validate` on transient network
      # errors (e.g. CloudKit ticket-delivery API dropping the connection).
      # Mirrors validateStapleWithRetry() in desktop/build.gradle.kts so CI
      # checkpoints don't hard-fail on the same network blips Gradle retries.
      - name: "[macOS] Install stapler-validate retry helper"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/stapler-retry.sh" <<'HELPER_EOF'
          validate_with_retry() {
            local target="$1"
            local max_attempts="${2:-5}"
            local wait_seconds="${3:-30}"
            local attempt=1
            local out exit_code
            while [ "$attempt" -le "$max_attempts" ]; do
              out=$(xcrun stapler validate "$target" 2>&1)
              exit_code=$?
              echo "$out"
              if [ $exit_code -eq 0 ]; then
                return 0
              fi
              if echo "$out" | grep -qiE "Error 65|Record not found|Code=-1005|Code=-1001|Code=-1004|NSPOSIXErrorDomain Code=54|network connection was lost|could not connect to the server|could not be found|inconsistent with expections|timed out"; then
                if [ "$attempt" -lt "$max_attempts" ]; then
                  echo "⚠️  stapler validate transient error (attempt $attempt/$max_attempts) — retrying in ${wait_seconds}s..."
                  sleep "$wait_seconds"
                  attempt=$((attempt + 1))
                  continue
                fi
              fi
              return $exit_code
            done
            return 1
          }
          HELPER_EOF
          echo "✓ Helper installed at $RUNNER_TEMP/stapler-retry.sh"

      - name: "[macOS] Verify DMG signature and staple ticket before upload"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          DMG="${{ matrix.artifact-pattern }}"
          source "$RUNNER_TEMP/stapler-retry.sh"

          echo "══════════════════════════════════════════════════════════════"
          echo "CHECKPOINT 1 — DMG before upload to artifact store"
          echo "══════════════════════════════════════════════════════════════"

          if [ ! -f "$DMG" ]; then
            echo "❌ DMG not found: $DMG"
            echo "Contents of desktop/build/compose/notarized/:"
            ls -la desktop/build/compose/notarized/ || true
            exit 1
          fi

          echo "── File ────────────────────────────────────────────────────"
          ls -lh "$DMG"
          shasum -a 256 "$DMG"

          echo "── Code signature ──────────────────────────────────────────"
          codesign --verify --verbose=2 "$DMG" 2>&1 || { echo "❌ codesign verify failed"; exit 1; }
          codesign --display --verbose=4 "$DMG" 2>&1 | grep -E "CDHash|TeamIdentifier|Identifier|Authority" || true

          echo "── Staple ticket ───────────────────────────────────────────"
          validate_with_retry "$DMG" || { echo "❌ STAPLE TICKET MISSING — Gradle task failed to staple"; exit 1; }
          echo "✅ Staple ticket present"

          echo "── Gatekeeper assessment ───────────────────────────────────"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG" 2>&1 \
            || { echo "❌ Gatekeeper rejected DMG"; exit 1; }
          echo "✅ Gatekeeper accepts DMG"
          echo "══════════════════════════════════════════════════════════════"

      # ── CHECKPOINT 1b: verify the INNER .app also carries a stapled ticket ──
      # The DMG having a ticket is not enough: once a user drags Askimo.app out
      # of the DMG into /Applications, only the .app's own ticket matters.
      # Without it, Gatekeeper falls back to its periodically-synced local
      # ticket database and can report "Unnotarized Developer ID" for hours
      # even though notarization genuinely succeeded. Fail the pipeline here,
      # before anything is uploaded, if the inner .app isn't stapled.
      - name: "[macOS] Verify inner .app has a stapled ticket"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          DMG="${{ matrix.artifact-pattern }}"
          source "$RUNNER_TEMP/stapler-retry.sh"

          echo "══════════════════════════════════════════════════════════════"
          echo "CHECKPOINT 1b — inner .app ticket before upload to artifact store"
          echo "══════════════════════════════════════════════════════════════"

          MOUNT_DIR=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR"

          cleanup() { hdiutil detach "$MOUNT_DIR" -force >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          APP=$(find "$MOUNT_DIR" -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$APP" ]; then
            echo "❌ No .app bundle found inside DMG"
            ls -la "$MOUNT_DIR"
            exit 1
          fi
          echo "── Found app: $APP"

          echo "── Staple ticket on .app ────────────────────────────────────"
          validate_with_retry "$APP" \
            || { echo "❌ STAPLE TICKET MISSING on .app — Gradle notarizeApp failed to staple"; exit 1; }
          echo "✅ Staple ticket present on .app"

          echo "── Gatekeeper assessment of .app ────────────────────────────"
          spctl -a -vvv "$APP" 2>&1 \
            || { echo "❌ Gatekeeper rejects the .app"; exit 1; }
          echo "✅ Gatekeeper accepts .app"
          echo "══════════════════════════════════════════════════════════════"


      - name: Build uber JAR (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" desktop:packageUberJarForCurrentOS

      - name: Build uber JAR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon "-Dorg.gradle.jvmargs=-Xmx4g" desktop:packageUberJarForCurrentOS

      - name: Locate artifacts
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          PATTERN="${{ matrix.artifact-pattern }}"

          if [ "$RUNNER_OS" == "macOS" ]; then
            PKG="$PATTERN"
            if [ ! -f "$PKG" ]; then
              echo "❌ Installer not found at: $PKG" >&2
              ls -la desktop/build/compose/notarized/ || true
              exit 1
            fi
          else
            PKG="$(compgen -G "$PATTERN" 2>/dev/null | head -n1 || ls $PATTERN 2>/dev/null | head -n1 || true)"
            if [ -z "$PKG" ]; then
              echo "❌ No installer found matching: $PATTERN" >&2
              exit 1
            fi
          fi

          JAR=$(find desktop/build/compose/jars -name "*.jar" -type f 2>/dev/null | head -n1 || true)
          if [ -z "$JAR" ]; then
            echo "❌ No uber JAR found in desktop/build/compose/jars/" >&2
            exit 1
          fi

          echo "package=$PKG" >> $GITHUB_OUTPUT
          echo "jar=$JAR"     >> $GITHUB_OUTPUT
          echo "✓ Installer : $PKG"
          echo "✓ Uber JAR  : $JAR"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: askimo-desktop-installer-${{ matrix.artifact-suffix }}
          path: ${{ steps.locate.outputs.package }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload uber JAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: askimo-desktop-jar-${{ matrix.artifact-suffix }}
          path: ${{ steps.locate.outputs.jar }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload notarization log on failure
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: notarize-log-${{ matrix.name }}-attempt${{ github.run_attempt }}
          path: ~/Library/Logs/notarytool/
          if-no-files-found: warn
          retention-days: 7


  # ── Create GitHub release ─────────────────────────────────────────────────
  release:
    name: Create Desktop Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ desktop-package ]
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      # Same transient-network-retry helper as the desktop-package job (separate
      # runner, so it must be re-installed here).
      - name: "[macOS] Install stapler-validate retry helper"
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/stapler-retry.sh" <<'HELPER_EOF'
          validate_with_retry() {
            local target="$1"
            local max_attempts="${2:-5}"
            local wait_seconds="${3:-30}"
            local attempt=1
            local out exit_code
            while [ "$attempt" -le "$max_attempts" ]; do
              out=$(xcrun stapler validate "$target" 2>&1)
              exit_code=$?
              echo "$out"
              if [ $exit_code -eq 0 ]; then
                return 0
              fi
              if echo "$out" | grep -qiE "Error 65|Record not found|Code=-1005|Code=-1001|Code=-1004|NSPOSIXErrorDomain Code=54|network connection was lost|could not connect to the server|could not be found|inconsistent with expections|timed out"; then
                if [ "$attempt" -lt "$max_attempts" ]; then
                  echo "⚠️  stapler validate transient error (attempt $attempt/$max_attempts) — retrying in ${wait_seconds}s..."
                  sleep "$wait_seconds"
                  attempt=$((attempt + 1))
                  continue
                fi
              fi
              return $exit_code
            done
            return 1
          }
          HELPER_EOF
          echo "✓ Helper installed at $RUNNER_TEMP/stapler-retry.sh"

      # ── CHECKPOINT 2: confirm what arrived after upload-artifact round-trip ──
      # upload-artifact zips the file; that zip round-trip may strip the staple
      # ticket xattr. We re-staple from Apple CDN and HARD FAIL if it doesn't work.
      - name: "[macOS] Re-staple DMGs after artifact download"
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/stapler-retry.sh"
          echo "══════════════════════════════════════════════════════════════"
          echo "CHECKPOINT 2 — DMGs after download-artifact"
          echo "══════════════════════════════════════════════════════════════"
          echo "Full artifact tree received:"
          ls -lhR dist/
          echo ""

          FAILED=0
          for platform in macos-arm64 macos-intel; do
            echo "──────────────────────────────────────────────────────────"
            echo "Platform: $platform"
            DMG=$(find "dist/askimo-desktop-installer-${platform}" -name "*.dmg" -type f 2>/dev/null | head -n1 || true)
            if [ -z "$DMG" ]; then
              echo "⚠️  No DMG found for $platform — skipping (matrix may have failed)"
              continue
            fi

            echo "   File    : $DMG"
            ls -lh "$DMG"
            echo "   SHA-256 : $(shasum -a 256 "$DMG")"

            echo "   Code signature:"
            codesign --verify --verbose=2 "$DMG" 2>&1 \
              && echo "   ✅ Signature OK" \
              || { echo "   ❌ SIGNATURE INVALID"; FAILED=1; continue; }
            codesign --display --verbose=4 "$DMG" 2>&1 | grep -E "CDHash|TeamIdentifier|Identifier|Authority|Signed Time" || true

            echo "   Staple ticket before re-staple:"
            validate_with_retry "$DMG" \
              && echo "   ℹ️  Ticket still present (survived zip)" \
              || echo "   ℹ️  Ticket stripped by upload-artifact zip (expected — will re-staple)"

            echo "   📎 Re-stapling from Apple CDN..."
            set +e
            xcrun stapler staple "$DMG" 2>&1
            STAPLE_EXIT=$?
            set -e
            if [ $STAPLE_EXIT -ne 0 ]; then
              echo "   ❌ RE-STAPLE FAILED (exit $STAPLE_EXIT) for $platform"
              echo "   This means Apple CDN does not have a ticket for this DMG."
              echo "   The notarization step may have succeeded but the DMG was"
              echo "   re-created/modified after stapling — the hashes won't match."
              FAILED=1
              continue
            fi

            echo "   Staple ticket after re-staple:"
            validate_with_retry "$DMG" \
              && echo "   ✅ Re-staple verified" \
              || { echo "   ❌ VALIDATE FAILED after re-staple"; FAILED=1; }

            echo "   SHA-256 after re-staple: $(shasum -a 256 "$DMG")"
            echo ""
          done

          echo "══════════════════════════════════════════════════════════════"
          if [ "$FAILED" -ne 0 ]; then
            echo "❌ CHECKPOINT 2 FAILED — one or more DMGs are not properly notarized."
            echo "   Do NOT release. Fix the notarization pipeline and re-run."
            exit 1
          fi
          echo "✅ CHECKPOINT 2 PASSED — all DMGs re-stapled successfully"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/stapler-retry.sh"
          mkdir -p release

          echo "══════════════════════════════════════════════════════════════"
          echo "Prepare release assets"
          echo "══════════════════════════════════════════════════════════════"

          # ── macOS ARM64 DMG ──────────────────────────────────────────────
          if [ -d "dist/askimo-desktop-installer-macos-arm64" ]; then
            SRC=$(find dist/askimo-desktop-installer-macos-arm64 -name "*.dmg" -type f | head -n1)
            if [ -z "$SRC" ]; then
              echo "❌ ARM64 DMG not found in dist/askimo-desktop-installer-macos-arm64/" >&2; exit 1
            fi
            DEST="release/Askimo-Desktop-macos-arm64.dmg"
            # cp preserves the embedded staple ticket (it's in the DMG code signature,
            # not a filesystem xattr, so a plain copy is sufficient)
            cp "$SRC" "$DEST"
            echo "✓ Copied ARM64 DMG  : $DEST  ($(du -sh "$DEST" | cut -f1))"
            # Verify ticket survived the copy
            validate_with_retry "$DEST" \
              && echo "  ✅ Staple ticket intact after copy" \
              || { echo "  ❌ Staple ticket LOST after cp — aborting"; exit 1; }
          fi

          # ── macOS Intel DMG ──────────────────────────────────────────────
          if [ -d "dist/askimo-desktop-installer-macos-intel" ]; then
            SRC=$(find dist/askimo-desktop-installer-macos-intel -name "*.dmg" -type f | head -n1)
            if [ -z "$SRC" ]; then
              echo "❌ Intel DMG not found in dist/askimo-desktop-installer-macos-intel/" >&2; exit 1
            fi
            DEST="release/Askimo-Desktop-macos-x64.dmg"
            cp "$SRC" "$DEST"
            echo "✓ Copied Intel DMG  : $DEST  ($(du -sh "$DEST" | cut -f1))"
            validate_with_retry "$DEST" \
              && echo "  ✅ Staple ticket intact after copy" \
              || { echo "  ❌ Staple ticket LOST after cp — aborting"; exit 1; }
          fi

          # ── Windows MSI ──────────────────────────────────────────────────
          if [ -d "dist/askimo-desktop-installer-windows" ]; then
            MSI=$(find dist/askimo-desktop-installer-windows -name "*.msi" -type f | head -n1)
            if [ -n "$MSI" ]; then
              cp "$MSI" "release/Askimo-Desktop-windows-x64.msi"
              echo "✓ Copied Windows MSI: release/Askimo-Desktop-windows-x64.msi"
            fi
          fi

          # ── Linux x64 DEB ────────────────────────────────────────────────
          if [ -d "dist/askimo-desktop-installer-linux" ]; then
            DEB=$(find dist/askimo-desktop-installer-linux -name "*.deb" -type f | head -n1)
            if [ -n "$DEB" ]; then
              cp "$DEB" "release/Askimo-Desktop-linux-x64.deb"
              echo "✓ Copied Linux x64  : release/Askimo-Desktop-linux-x64.deb"
            fi
          fi

          # ── Linux ARM64 DEB ──────────────────────────────────────────────
          if [ -d "dist/askimo-desktop-installer-linux-arm64" ]; then
            DEB=$(find dist/askimo-desktop-installer-linux-arm64 -name "*.deb" -type f | head -n1)
            if [ -n "$DEB" ]; then
              cp "$DEB" "release/Askimo-Desktop-linux-arm64.deb"
              echo "✓ Copied Linux ARM64: release/Askimo-Desktop-linux-arm64.deb"
            fi
          fi

          # ── Uber JARs ────────────────────────────────────────────────────
          for entry in \
            "askimo-desktop-jar-macos-arm64:askimo-desktop-macos-arm64.jar" \
            "askimo-desktop-jar-macos-intel:askimo-desktop-macos-x64.jar" \
            "askimo-desktop-jar-windows:askimo-desktop-windows-x64.jar" \
            "askimo-desktop-jar-linux:askimo-desktop-linux-x64.jar" \
            "askimo-desktop-jar-linux-arm64:askimo-desktop-linux-arm64.jar"; do
            artifact="${entry%%:*}"
            destname="${entry##*:}"
            if [ -d "dist/$artifact" ]; then
              JAR=$(find "dist/$artifact" -name "*.jar" -type f | head -n1)
              if [ -n "$JAR" ]; then
                cp "$JAR" "release/$destname"
                echo "✓ Copied JAR        : release/$destname"
              fi
            fi
          done

          echo ""
          if [ -z "$(ls release/ 2>/dev/null)" ]; then
            echo "❌ No release files found in release/ — aborting" >&2
            exit 1
          fi

          echo "Computing checksums..."
          cd release && shasum -a 256 * > SHA256SUMS.txt && cd ..

          echo ""
          echo "Release files prepared:"
          ls -lh release/
          echo "══════════════════════════════════════════════════════════════"

      # ── CHECKPOINT 3: final gate before upload to GitHub Releases ────────
      # Hard fail if staple ticket or Gatekeeper check is missing.
      # This is the LAST line of defence before files reach users.
      - name: "[macOS] Final validation of release DMGs before GitHub upload"
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/stapler-retry.sh"
          FAILED=0

          echo "══════════════════════════════════════════════════════════════"
          echo "CHECKPOINT 3 — Final gate before GitHub Releases upload"
          echo "══════════════════════════════════════════════════════════════"

          shopt -s nullglob
          DMGS=(release/Askimo-Desktop-macos-*.dmg)
          if [ ${#DMGS[@]} -eq 0 ]; then
            echo "⚠️  No macOS DMGs found in release/ — skipping macOS validation"
          fi

          for DMG in "${DMGS[@]}"; do
            echo "──────────────────────────────────────────────────────────"
            echo "Validating: $DMG"
            ls -lh "$DMG"
            echo "SHA-256: $(shasum -a 256 "$DMG")"

            echo "Code signature:"
            codesign --verify --verbose=2 "$DMG" 2>&1 \
              && echo "✅ Signature OK" \
              || { echo "❌ SIGNATURE INVALID — DO NOT RELEASE"; FAILED=1; }
            codesign --display --verbose=4 "$DMG" 2>&1 | grep -E "CDHash|TeamIdentifier|Identifier|Authority|Signed Time" || true

            echo "Staple ticket:"
            validate_with_retry "$DMG" \
              && echo "✅ Staple ticket present" \
              || { echo "❌ STAPLE TICKET MISSING — DO NOT RELEASE"; FAILED=1; }

            echo "Gatekeeper assessment:"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG" 2>&1 \
              && echo "✅ Gatekeeper accepts" \
              || { echo "❌ Gatekeeper REJECTS — DO NOT RELEASE"; FAILED=1; }

            echo "Inner .app staple ticket:"
            MOUNT_DIR=$(mktemp -d)
            if hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR" >/dev/null 2>&1; then
              APP=$(find "$MOUNT_DIR" -maxdepth 1 -name "*.app" | head -n1)
              if [ -z "$APP" ]; then
                echo "❌ No .app bundle found inside DMG — DO NOT RELEASE"
                FAILED=1
              else
                validate_with_retry "$APP" \
                  && echo "✅ Inner .app staple ticket present" \
                  || { echo "❌ INNER .app STAPLE TICKET MISSING — DO NOT RELEASE"; FAILED=1; }
                spctl -a -vvv "$APP" 2>&1 \
                  && echo "✅ Gatekeeper accepts inner .app" \
                  || { echo "❌ Gatekeeper REJECTS inner .app — DO NOT RELEASE"; FAILED=1; }
              fi
              hdiutil detach "$MOUNT_DIR" -force >/dev/null 2>&1 || true
            else
              echo "❌ Could not mount DMG to inspect inner .app — DO NOT RELEASE"
              FAILED=1
            fi
            rmdir "$MOUNT_DIR" 2>/dev/null || true
            echo ""
          done

          echo "══════════════════════════════════════════════════════════════"
          if [ "$FAILED" -ne 0 ]; then
            echo "❌ CHECKPOINT 3 FAILED — one or more DMGs did not pass validation."
            echo "   Aborting release. Check the output above for details."
            exit 1
          fi
          echo "✅ CHECKPOINT 3 PASSED — all DMGs are safe to upload to GitHub Releases"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*
          # Only upload files — do NOT touch the release body/notes.
          # Notes are authored manually; contributors are appended by the contributors job.
          append_body: false
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ── Post-publish smoke test ───────────────────────────────────────────────
  # Downloads the DMG exactly as a real user would (via `gh release download`
  # against the published GitHub Release asset) and re-runs the full Gatekeeper
  # verification chain end-to-end. This is the only checkpoint that validates
  # what actually ends up in users' hands, catching any corruption/stripping
  # introduced by the action-gh-release upload step itself.
  verify-release:
    name: Verify published release (Gatekeeper smoke test) - ${{ matrix.arch }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ release ]
    runs-on: macos-latest
    # The Intel (x64) smoke test has shown recurring transient network failures
    # talking to Apple's CloudKit ticket-delivery API from GitHub's macos-latest
    # runner specifically when validating the Intel DMG (build/package/staple
    # themselves work fine — only this post-publish check is flaky). Don't let
    # that block the release: ARM64's smoke test must still pass.
    continue-on-error: ${{ matrix.arch == 'x64' }}
    # NOTE: draft releases are only visible via the GitHub API to tokens with
    # push/write access — a read-only token silently omits them from the
    # releases list (this is GitHub's documented behavior, not a bug), which
    # caused "No release (draft or published) found" even though the release
    # job had just created it successfully. `contents: write` is required here
    # purely to read the draft; this job does not modify the repo.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            asset: Askimo-Desktop-macos-arm64.dmg
          - arch: x64
            asset: Askimo-Desktop-macos-x64.dmg

    steps:
      - name: "[macOS] Install stapler-validate retry helper"
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/stapler-retry.sh" <<'HELPER_EOF'
          validate_with_retry() {
            local target="$1"
            local max_attempts="${2:-5}"
            local wait_seconds="${3:-30}"
            local attempt=1
            local out exit_code
            while [ "$attempt" -le "$max_attempts" ]; do
              out=$(xcrun stapler validate "$target" 2>&1)
              exit_code=$?
              echo "$out"
              if [ $exit_code -eq 0 ]; then
                return 0
              fi
              if echo "$out" | grep -qiE "Error 65|Record not found|Code=-1005|Code=-1001|Code=-1004|NSPOSIXErrorDomain Code=54|network connection was lost|could not connect to the server|could not be found|inconsistent with expections|timed out"; then
                if [ "$attempt" -lt "$max_attempts" ]; then
                  echo "⚠️  stapler validate transient error (attempt $attempt/$max_attempts) — retrying in ${wait_seconds}s..."
                  sleep "$wait_seconds"
                  attempt=$((attempt + 1))
                  continue
                fi
              fi
              return $exit_code
            done
            return 1
          }
          HELPER_EOF
          echo "✓ Helper installed at $RUNNER_TEMP/stapler-retry.sh"

      - name: Wait for release assets to propagate
        run: sleep 30

      - name: Download published DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="askimo-ai/askimo"
          TAG="${{ github.ref_name }}"
          ASSET_NAME="${{ matrix.asset }}"

          # `gh release download <tag>` looks up the release via GitHub's
          # "get release by tag" API, which only returns PUBLISHED releases.
          # Our `release` job uploads with `draft: true`, so that lookup
          # 404s ("release not found") even though the release and its
          # assets genuinely exist. Use the releases-list API instead,
          # which does include drafts, find the release matching our tag,
          # then download the specific asset by its numeric ID.
          echo "🔎 Looking up release for tag '$TAG' (including drafts)..."
          RELEASE_JSON=$(gh api "repos/$REPO/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0]")

          if [ -z "$RELEASE_JSON" ] || [ "$RELEASE_JSON" == "null" ]; then
            echo "❌ No release (draft or published) found for tag '$TAG' in $REPO"
            exit 1
          fi

          ASSET_ID=$(echo "$RELEASE_JSON" | jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .id')
          if [ -z "$ASSET_ID" ] || [ "$ASSET_ID" == "null" ]; then
            echo "❌ Asset '$ASSET_NAME' not found on release for tag '$TAG'"
            echo "Available assets:"
            echo "$RELEASE_JSON" | jq -r '.assets[].name'
            exit 1
          fi

          echo "📥 Downloading asset '$ASSET_NAME' (id=$ASSET_ID)..."
          gh api "repos/$REPO/releases/assets/$ASSET_ID" \
            -H "Accept: application/octet-stream" > "$ASSET_NAME"

          if [ ! -s "$ASSET_NAME" ]; then
            echo "❌ Downloaded file is empty/missing: $ASSET_NAME"
            exit 1
          fi
          echo "✅ Downloaded $(ls -lh "$ASSET_NAME" | awk '{print $5}') -> $ASSET_NAME"

      - name: Verify downloaded DMG + inner .app (real Gatekeeper check)
        run: |
          set -euo pipefail
          DMG="${{ matrix.asset }}"
          source "$RUNNER_TEMP/stapler-retry.sh"

          echo "══════════════════════════════════════════════════════════════"
          echo "SMOKE TEST — published DMG as downloaded by a real user"
          echo "════════════════════════════════════════════════════════════"

          if [ ! -f "$DMG" ]; then
            echo "❌ Download failed — $DMG not found"
            exit 1
          fi

          ls -lh "$DMG"
          shasum -a 256 "$DMG"

          echo "── DMG code signature ──────────────────────────────────────"
          codesign --verify --verbose=2 "$DMG" 2>&1 \
            || { echo "❌ DMG signature INVALID"; exit 1; }
          echo "✅ DMG signature OK"

          echo "── DMG staple ticket ───────────────────────────────────────"
          validate_with_retry "$DMG" \
            || { echo "❌ DMG staple ticket MISSING"; exit 1; }
          echo "✅ DMG staple ticket present"

          echo "── DMG Gatekeeper assessment ───────────────────────────────"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG" 2>&1 \
            || { echo "❌ Gatekeeper REJECTS DMG"; exit 1; }
          echo "✅ Gatekeeper accepts DMG"

          echo ""
          echo "── Inner .app (simulates dragging to /Applications) ───────"
          MOUNT_DIR=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR"

          cleanup() { hdiutil detach "$MOUNT_DIR" -force >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          APP=$(find "$MOUNT_DIR" -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$APP" ]; then
            echo "❌ No .app bundle found inside DMG"
            exit 1
          fi
          echo "Found: $APP"

          INSTALLED="/tmp/Askimo.app"
          rm -rf "$INSTALLED"
          cp -R "$APP" "$INSTALLED"

          echo "-- Installed .app staple ticket --"
          validate_with_retry "$INSTALLED" \
            || { echo "❌ Installed .app staple ticket MISSING"; exit 1; }
          echo "✅ Installed .app staple ticket present"

          echo "-- Installed .app Gatekeeper (what the end user actually sees) --"
          spctl -a -vvv "$INSTALLED" 2>&1 \
            || { echo "❌ Gatekeeper REJECTS installed .app"; exit 1; }
          echo "✅ Gatekeeper accepts installed .app"

          echo ""
          echo "══════════════════════════════════════════════════════════════"
          echo "✅ SMOKE TEST PASSED — published release is safe for end users"
          echo "══════════════════════════════════════════════════════════════"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-verify-failure-${{ matrix.arch }}
          path: "*.dmg"
          if-no-files-found: ignore
          retention-days: 7
