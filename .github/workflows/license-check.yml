name: Third-Party License Check

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  license-check:
    name: license-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Fails the build if any subproject resolves a dependency whose license
      # is not in gradle/allowed-licenses.json. See build.gradle.kts for details.
      - name: Check third-party dependency licenses
        run: ./gradlew --no-daemon checkThirdPartyLicenses

